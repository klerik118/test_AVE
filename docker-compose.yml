
services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: telephone-address
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network


  redis:
    image: redis:latest
    container_name: redis_app
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    command: redis-server --appendonly yes --bind 0.0.0.0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network


  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redisinsight_app
    ports:
      - "5540:5540"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - app-network


volumes:
  redis_data:

networks:
  app-network:

